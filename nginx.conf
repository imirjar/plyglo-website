# Основной конфиг Nginx
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Настройки рабочих процессов
events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

# HTTP-блок
http {
    # Базовые настройки
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Формат логов
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Производительность
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Настройки буферизации
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Настройки таймаутов
    send_timeout 60;
    client_body_timeout 60;
    client_header_timeout 60;

    # Сжатие (глобальные настройки)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml 
               application/xml+rss text/javascript application/x-javascript;


    # Подключение всех конфигов сайтов
    # include /etc/nginx/conf.d/*.conf;
    # include /etc/nginx/sites-enabled/*.conf;

    # Если нужно - запасной сервер на 80 порту
    # (если в site.conf уже есть listen 80, этот блок не нужен)
    server {
        listen 80;
        
        root /var/www/site;
        index index.html;


        # Кеширование статики
        location ~* \.(css|js|mjs|jpg|jpeg|gif|png|svg|ico|webp|woff|woff2|json|map)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # SPA роутинг - все запросы на index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Безопасность
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

}